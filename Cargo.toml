[workspace]
resolver = "2"
members = [
    "crates/nexus-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["NEXUS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexus-agentic/nexus"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.release-debug]
inherits = "release"
debug = true

[profile.bench]
inherits = "release"
debug = true